org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP marks debug APKs `testOnly`, which makes `adb install` fail with
# INSTALL_FAILED_TEST_ONLY unless every install passes `-t`. This app is installed
# on the user's own watch for real use, not by a test runner, so the flag is
# turned off and a plain `adb install -r` works.
android.injected.testOnly=false

kotlin.code.style=official
