# Version catalog for the watch app. Versions were resolved from Google Maven
# and Maven Central metadata rather than guessed, so a clean build uses exactly
# the stable releases that exist.
[versions]
agp = "9.4.1"
kotlin = "2.4.20"
# Compose 1.12 (BOM 2026.09.00) requires compiling against API 37, which this
# channel publishes only as a preview; this BOM pins Compose 1.11, which compiles
# against the released API 36. Bump both together with `compileSdk`.
composeBom = "2026.06.01"
# Wear Compose 1.7 is the first release with material3 `Scaffold` and
# `OutlinedTextField`; it requires compiling against API 37, which this SDK
# channel publishes as the `CinnamonBun` preview (see app/build.gradle.kts).
wearCompose = "1.7.0"
wearInput = "1.2.0"
coreKtx = "1.17.0"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
datastore = "1.2.1"
splashscreen = "1.2.0"
serialization = "1.11.0"
coroutines = "1.11.0"
okhttp = "5.5.0"
junit = "4.13.2"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "splashscreen" }

# Compose BOM pins every Compose artifact to one mutually tested set.
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
# Crossfade and the animation specs; the BOM pins the version with the rest.
androidx-compose-animation = { module = "androidx.compose.animation:animation" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-material-icons = { module = "androidx.compose.material:material-icons-core" }

# Wear OS Compose has its own release train and is not in the Compose BOM.
androidx-wear-compose-material3 = { module = "androidx.wear.compose:compose-material3", version.ref = "wearCompose" }
androidx-wear-compose-foundation = { module = "androidx.wear.compose:compose-foundation", version.ref = "wearCompose" }
androidx-wear-compose-navigation = { module = "androidx.wear.compose:compose-navigation", version.ref = "wearCompose" }
# Voice input goes through the system input activity, whose helpers live here.
androidx-wear-input = { module = "androidx.wear:wear-input", version.ref = "wearInput" }

kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }

junit = { module = "junit:junit", version.ref = "junit" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
